# resources/fintech_job.yml
# Defines a Databricks Job that chains six tasks in strict sequence:
#   1. Run the DLT Pipeline (cleans the raw dirty data)
#   2. Export the final cleaned Delta table as plain Parquet to /clean/
#   3. Validate the exported data with Great Expectations (quality gate
#      before Snowpipe auto-ingests it)
#   4. Run VACUUM maintenance on the cleaned table
#   5. Run the dbt project (Bronze -> Silver Star Schema -> Gold)
#      against Snowflake, using Databricks' native dbt_task
#   6. Call a Snowpark stored procedure in Snowflake to categorize
#      customer risk, built on top of dbt's already-cleaned Silver
#      table (fact_customer_activity) -- NOT on raw, unprocessed data
#
# Tasks 2-4 and 6 reuse the existing interactive cluster
# (fintech-cleaning-cluster) via existing_cluster_id -- this
# workspace's API rejected new_cluster specs repeatedly with
# "Missing required field: settings.cluster_spec.new_cluster.size".
# Task 5 (dbt) uses a serverless environment instead, since dbt_task
# is designed to run without a dedicated cluster.

resources:
  jobs:
    fintech_full_pipeline:
      name: fintech-full-pipeline-${bundle.target}

      environments:
        - environment_key: dbt_snowflake_env
          spec:
            client: "1"
            dependencies:
              - dbt-core
              - dbt-snowflake

      tasks:
        - task_key: run_dlt_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.fintech_cleaning_pipeline.id}

        - task_key: export_to_clean
          depends_on:
            - task_key: run_dlt_pipeline
          notebook_task:
            notebook_path: ../src/export_to_clean.py
          existing_cluster_id: 0823-022403-npgq5k7m

        - task_key: validate_with_great_expectations
          depends_on:
            - task_key: export_to_clean
          notebook_task:
            notebook_path: ../src/validate_with_great_expectations.py
          existing_cluster_id: 0823-022403-npgq5k7m

        - task_key: vacuum_maintenance
          depends_on:
            - task_key: validate_with_great_expectations
          notebook_task:
            notebook_path: ../src/vacuum_maintenance.py
          existing_cluster_id: 0823-022403-npgq5k7m

        - task_key: run_dbt
          depends_on:
            - task_key: vacuum_maintenance
          notebook_task:
            notebook_path: ../src/run_dbt_transformations.py
          existing_cluster_id: 0823-022403-npgq5k7m


        - task_key: call_snowflake_risk_categorization
          depends_on:
            - task_key: run_dbt
          notebook_task:
            notebook_path: ../src/call_snowflake_risk_procedure.py
          existing_cluster_id: 0823-022403-npgq5k7m

      email_notifications:
        on_failure:
          - felix.david.cordova.garcia@gmail.com